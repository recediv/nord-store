name: Deploy demo to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/storefront/package-lock.json

      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@v5

      - name: Install storefront dependencies
        run: npm --prefix apps/storefront ci --no-audit --no-fund

      - name: Build static JSON demo
        run: npm run build:demo
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path || '/' }}
          NEXT_PUBLIC_BASE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/storefront/out-demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
