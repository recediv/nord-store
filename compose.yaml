services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: nord
      POSTGRES_PASSWORD: nord_demo
      POSTGRES_DB: nord_demo
    ports:
      - '127.0.0.1:5438:5432'
    volumes:
      - nord-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nord -d nord_demo']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  nord-postgres:
